spring.application.name=hello-spring-ai-otel-langfuse
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=gemma4:12b-mlx
#
# spring-ai-autoconfigure-model-chat-observation-2.0.0.jar ChatObservationProperties
#
# Include prompt content in tracing (disabled by default for privacy)
spring.ai.chat.observations.log-prompt=true
# Include completion content in tracing (disabled by default)
spring.ai.chat.observations.log-completion=true
spring.ai.chat.observations.include-error-logging=true
#
# spring-ai-autoconfigure-model-chat-client-2.0.0.jar ChatClientBuilderProperties
#
spring.ai.chat.client.observations.log-completion=true
spring.ai.chat.client.observations.log-prompt=true
#
#
#
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,*
management.endpoint.health.show-details=always
# 关闭默认打开的 metrics
management.otlp.metrics.export.enabled=false
# Enable @Observed (if you use observation annotations in code)
management.observations.annotations.enabled=true
# Suppress duplicate Micrometer HTTP
management.observations.enable.http.server.requests=false
management.observations.enable.http.client.requests=false
# 抽样率，默认 0.1 >> 1
management.tracing.sampling.probability=1
#
#  cat /etc/profile.d/KEYS.sh
#
management.opentelemetry.tracing.export.otlp.transport=http
management.opentelemetry.tracing.export.otlp.endpoint=${LANGFUSE_BASE_URL}/api/public/otel/v1/traces
management.opentelemetry.tracing.export.otlp.headers.Authorization=${LANGFUSE_AUTH_HEADER}
#management.opentelemetry.tracing.export.otlp.headers.Authorization=${LANGFUSE_AUTH_HEADER},x-langfuse-ingestion-version=4
# 据说增加 x-langfuse-ingestion-version=4 后，Langfuse 的数据显示延时会从 5～10 分钟降低到近实时
management.opentelemetry.tracing.export.otlp.headers.x-langfuse-ingestion-version=4

